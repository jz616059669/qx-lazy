# Quantumult X 懒人配置包 (优化精简版)
# 基于 jz616059669/qx-lazy 精简优化
# 更新时间：2026-08-15 (v22 - 同步墨鱼 V269 最新源)
# 参考：墨鱼自用QX配置 https://ddgksf2013.top/Profile/QuantumultX.conf
# 要求: Quantumult X >= 1.6.0 (支持AnyTLS协议)

[general]
server_check_url=http://www.gstatic.com/generate_204
server_check_timeout=3000
resource_parser_url=https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/resource-parser.js
profile_img_url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png
geo_location_checker=disabled
excluded_routes=239.255.255.250/32, 24.105.30.129/32, 185.60.112.157/32, 185.60.112.158/32, 182.162.132.1/32
dns_exclusion_list=*.10099.com.cn, *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn
udp_drop_list=443, STUN, QUIC
# 如抖音/小红书去广告失效，可改用以下白名单（对淘宝/QQ可能有影响）
# udp_whitelist=1-442, 444-65535
fallback_udp_policy=direct
# WiFi智能切换（连接 炸弹_5G 时直连）
running_mode_trigger=filter, filter, 炸弹_5G:all_direct

[dns]
# 加密DNS（DoH）- 避免DNS污染，支持IPv6 AAAA解析
doh-server=https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://cloudflare-dns.com/dns-query, https://dns.google.com/dns-query
no-system
# 明文DNS兜底（DoH失效时使用）
server=223.5.5.5
server=119.29.29.29
server=114.114.114.114
# 关键域名指定DNS（改善App连接）
server=/*.icloud.com/119.29.29.29
server=/*.icloud.com.cn/119.29.29.29
server=/*.tencent.com/119.29.29.29
server=/*.weixin.com/119.29.29.29
# IPv6 已启用（未加 no-ipv6）；如需关闭在下面加 no-ipv6
# 若开启 IPv6 后个别 App 异常，请在 QX「VPN」栏开启「兼容性增强」

[task_local]
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/streaming-ui-check.js, tag=流媒体解锁查询, img-url=arrowtriangle.right.square.system, enabled=true
event-interaction https://ddgksf2013.top/scripts/server-info-pure.js, tag=节点纯净度详情, img-url=checkmark.shield.fill.system
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/nf-ui-check.js, tag=Netflix解锁查询, img-url=checkmark.seal.system, enabled=true
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/ytb-ui-check.js, tag=YouTube解锁查询, img-url=checkmark.seal.system, enabled=true
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/disney-ui-check.js, tag=Disney+解锁查询, img-url=checkmark.seal.system, enabled=true
event-interaction https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/IPCheck.js, tag=IP信息查询, img-url=globe.system, enabled=true
event-network https://raw.githubusercontent.com/KOP-XIAO/QuantumultX/master/Scripts/network-direct.js, tag=WiFi直连切换, img-url=switch.2.system, enabled=true

[policy]
# ========== 自动优选（每10分钟测速，延迟差>20ms才切换）==========
url-latency-benchmark=🚀 自动选择, server-tag-regex=.*, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Auto.png

# ========== 按地区分组 ==========
url-latency-benchmark=🇭🇰 香港节点, server-tag-regex=(?=.*(港|HK|(?i)Hong))^((?!(台|日|韩|新|美|德|英|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
url-latency-benchmark=🇹🇼 台湾节点, server-tag-regex=(?=.*(台|TW|(?i)Taiwan))^((?!(港|日|韩|新|美|德|英|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/TW.png
url-latency-benchmark=🇯🇵 日本节点, server-tag-regex=(?=.*(日|JP|(?i)Japan))^((?!(港|台|韩|新|美|德|英|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/JP.png
url-latency-benchmark=🇰🇷 韩国节点, server-tag-regex=(?=.*(韩|KR|Korea|首尔))^((?!(港|台|日|新|美|德|英|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/KR.png
url-latency-benchmark=🇸🇬 新加坡节点, server-tag-regex=(?=.*(新|狮|SG|(?i)Singapore))^((?!(港|台|日|韩|美|德|英|澳|CA|加拿大)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/SG.png
url-latency-benchmark=🇺🇸 美国节点, server-tag-regex=(?=.*(美|US|(?i)States|American|亚特兰大|凤凰城))^((?!(港|台|日|韩|新|德|英|加|澳)).)*$, check-interval=120, tolerance=15, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/US.png
url-latency-benchmark=🇬🇧 英国节点, server-tag-regex=(?=.*(英|UK|(?i)Britain|London))^((?!(港|台|日|韩|新|美|德|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/UK.png
url-latency-benchmark=🇩🇪 德国节点, server-tag-regex=(?=.*(德|DE|(?i)Germany))^((?!(港|台|日|韩|新|美|英|加|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/DE.png
url-latency-benchmark=🇨🇦 加拿大节点, server-tag-regex=(?=.*(加|CA|(?i)Canada|加拿大))^((?!(港|台|日|韩|新|美|德|英|澳)).)*$, check-interval=120, tolerance=10, img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/CA.png

# ========== 专用策略 ==========
static=🍎 苹果服务, direct, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple.png
static=📺 Netflix, 🎬 Netflix, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Netflix_Letter.png
static=🎬 YouTube, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, 🇺🇸 美国节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/YouTube.png
static=🎵 Spotify, 🇺🇸 美国节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇭🇰 香港节点, 🇸🇬 新加坡节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Spotify.png
static=🤖 AI服务, 🇺🇸 美国节点, 🇯🇵 日本节点, 🇹🇼 台湾节点, 🇸🇬 新加坡节点, 🇭🇰 香港节点, direct, img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/ChatGPT.png
